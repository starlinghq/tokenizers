# Tokenizer profile: a tested combination of one pinned asset and the interpreter components it
# uses (profiles/README.md). Status values: supported, unsupported, experimental, untested.
# Release qualification is a maintainer decision; this file does not grant a badge.
profile: phi4-bpe-chat   # microsoft/Phi-4-mini-instruct; o200k vocabulary and split regex
status: experimental  # fixture results below; fixtures proposed, not yet accepted (conformance.fixtures)
backlog: Phi-4-mini model request (starlinghq/starling#109)
library: Starlings.Tokenizers 0.3.5   # results from the unreleased build of this pull request (Directory.Build.props still says 0.3.4; 0.3.4 cannot load this profile); the version bump lands in the 0.3.5 release pull request

asset:
  repo: microsoft/Phi-4-mini-instruct
  revision: cfbefacb99257ffa30c83adab238a50856ac3083
  file: tokenizer.json
  sha256: 382cc235b56c725945e149cc25f191da667c836655efd0857b004320e90e91ea
  size: 15524095
  format_version: "1.0"
  acquisition: tools/fetch-assets.sh   # never committed; MIT (the model's license)

runtime_pipeline:   # checked 2026-11-02 (conformance/phi4-bpe-chat/PROPOSED.md)
  transformers_5: "transformers 5.18.0 TokenizersBackend (tokenizer_config.json tokenizer_class GPT2Tokenizer); its live pipeline differs from this file only in the post-processor: an identity TemplateProcessing (single $A, pair $A $B:1, no special tokens) where the file has null. On all 137 corpus cases, with and without special tokens, ids, offsets, type ids, special-token masks and sequence ids are identical, so the Hub file is the asset."
  padding: tokenizer_config.json pad_token <|endoftext|> (199999)
  bos: add_bos_token false; the chat template writes the role tags itself

reference:
  implementation: huggingface/tokenizers 0.23.3 (Python binding, Tokenizer.from_file(asset)); reference/tokenizer-json/requirements.txt
  source_revision: 9ab7691f497eff905f961aba51a4bb9be3e9555c
  runner: reference/tokenizer-json/run_tokenizer_json.py --truncate 16 --without-special-tokens --batch ... --pad-token "<|endoftext|>" --pair-batch ...
  component_runner: reference/o200k-bpe/run_o200k_reference.py --asset   # TestData/o200k-bpe/
  offsets_unit: unicode-scalars   # reference unit; the .NET API also gives utf16-code-units

pipeline:   # exactly what the pinned file declares
  normalizer: null
  pre_tokenizer: Sequence[Split(Regex o200k "[^\r\n\p{L}\p{N}]?[\p{Lu}\p{Lt}\p{Lm}\p{Lo}\p{M}]*[\p{Ll}\p{Lm}\p{Lo}\p{M}]+(?i:'s|'t|'re|'ve|'m|'ll|'d)?|[^\r\n\p{L}\p{N}]?[\p{Lu}\p{Lt}\p{Lm}\p{Lo}\p{M}]+[\p{Ll}\p{Lm}\p{Lo}\p{M}]*(?i:'s|'t|'re|'ve|'m|'ll|'d)?|\p{N}{1,3}| ?[^\s\p{L}\p{N}]+[\r\n/]*|\s*[\r\n]+|\s+(?!\S)|\s+", Removed, invert true), ByteLevel(add_prefix_space false, trim_offsets true, use_regex false)]
  model: BPE(vocab 200019, merges 199742, unk_token null, byte_fallback false, ignore_merges false, dropout null, empty prefix and suffix)
  post_processor: null   # adds no tokens
  decoder: ByteLevel   # options unused by the decoder
  added_tokens: "12 (all normalized false, no lstrip or single_word): <|endoftext|> 199999 and <|endofprompt|> 200018 (in the vocabulary, special, no rstrip); 200019-200028 rstrip true, special <|assistant|>, <|end|>, <|user|>, <|system|>, <|tag|>, special false <|tool|>, <|/tool|>, <|tool_call|>, <|/tool_call|>, <|tool_response|>"
  truncation: null
  padding: null

conformance:
  fixtures: conformance/phi4-bpe-chat/   # proposed, not yet accepted by a maintainer (PROPOSED.md)
  corpus:
    - conformance/corpus/tokenizer-corpus-v1.jsonl (49 cases, sha256 8c291a87644c79012d00029c00480a81aa9e508138e4b7fe1485bb7cd1519199)
    - conformance/corpus/tokenizer-corpus-qwen-bpe-v1.jsonl (88 cases, sha256 8a95607487e6cb9a9c7aabeebbbc93bb5c62b206364db43e0c419061e9c2aed3)
  tests:
    - tests/Starlings.Tokenizers.Tests/ProfileConformanceTests.cs   # data-driven: encode, decode, truncated, without_special_tokens
    - tests/Starlings.Tokenizers.Tests/O200kSplitPatternTests.cs    # letter-category tables for every scalar; 12,420 reference splits
    - tests/Starlings.Tokenizers.Tests/Phi4BpeDifferentialTests.cs  # 1,500 random strings with the Phi-4 tags (rstrip)
  result: # 2026-11-02, Linux x64, .NET SDK 10.0.100, Debug
    encode: "137/137 cases exact (133 single, 4 pairs): ids, tokens, type_ids, attention_mask, special_tokens_mask, utf16 and scalar offsets, sequence_ids"
    encode_without_special_tokens: 137/137 cases exact (the same encodings; there is no post-processor)
    truncation: "44/44 truncated records exact (max_length 16, longest_first, right)"
    batch: 6 single texts and 4 pairs right-padded with <|endoftext|> 199999, exact, each row equal to its single encode
    decode: 137/137 cases exact, skip_special_tokens true and false
    split: "12,420/12,420 reference splits exact (every 1-3 character string over 20 class representatives, and 4,000 seeded random strings)"
    differential: "1,500/1,500 random strings exact (ids, tokens, scalar offsets, decode both ways); seed 20261103"

capabilities:
  encode_single: supported
  encode_pair: experimental            # 4 corpus pairs and a padded pair batch
  encode_batch: supported              # batch of single encodes
  add_special_tokens_false: supported  # nothing to add; every case recorded both ways
  offsets_utf16_code_units: supported
  offsets_unicode_scalars: supported
  sequence_ids: supported
  special_tokens_mask: supported
  added_tokens_special_and_non_special_in_text: experimental   # the corpus has generic literals, not the Phi-4 tags; the tags and rstrip are covered by the 1,500-string differential only
  added_token_rstrip: experimental     # Phi4BpeDifferentialTests; first profile with rstrip tokens
  decode_skip_special_tokens: supported
  decode_keep_special_tokens: supported
  decode_invalid_utf8: experimental    # shared ByteLevel decoder; no random id sequences for this profile
  truncation_right_longest_first: supported   # max_length 16 over the corpus (single and pair)
  truncation_left_only_first_only_second: experimental   # generic code path; no fixture for this profile
  padding_right_batch_longest: supported   # tokenizer-batch.json, pad <|endoftext|> 199999, singles and pairs
  padding_left_fixed_multiple: experimental   # generic code path; no fixture for this profile
  bpe_dropout_unk_token_byte_fallback_affixes: unsupported   # rejected at load
  single_word_added_token: unsupported # rejected at load
  chat_template: unsupported           # model-library behavior (starlinghq/starling)
  incremental_decode_stream: unsupported
  thread_safety: untested              # immutable by design
  performance: untested

known_divergences:
  against_reference: none on the fixtures, the split dump or the differential
  risks:
    - regex character classes are generated tables probed from the reference (tools/generate-unicode-tables.py); a different reference build would need a regeneration and requalification
