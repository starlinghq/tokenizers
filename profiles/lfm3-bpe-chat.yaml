# Tokenizer profile: a tested combination of one pinned asset and the interpreter components it
# uses (profiles/README.md). Status values: supported, unsupported, experimental, untested.
# Release qualification is a maintainer decision; this file does not grant a badge.
profile: lfm3-bpe-chat   # LiquidAI/LFM3-1.7B; adds no tokens
status: experimental  # fixture results below; fixtures proposed, not yet accepted (conformance.fixtures)
backlog: LFM3 model request (starlinghq/starling#217)
library: Starlings.Tokenizers 0.3.3

asset:
  repo: LiquidAI/LFM3-1.7B
  revision: 40ebe0aa6662c9d40389c2f5d565b6a2c6aebacd
  file: tokenizer.json
  sha256: 7e226e34bface23ccf6e495d157bf77186c1c30a7659880e1a8994db528c3701
  size: 17908635
  format_version: "1.0"
  acquisition: tools/fetch-assets.sh   # never committed; LFM Open License v1.0 (the model's license)

runtime_pipeline:   # checked 2026-10-28 (conformance/lfm3-bpe-chat/PROPOSED.md)
  transformers_5: transformers 5.21.0 TokenizersBackend (tokenizer_config.json tokenizer_class); its live pipeline equals this file as JSON
  padding: tokenizer_config.json pad_token <|pad|> (124893)
  bos: the chat template writes <|startoftext|> (124894) itself; the post-processor adds nothing

reference:
  implementation: huggingface/tokenizers 0.23.3 (Python binding, Tokenizer.from_file(asset)); reference/tokenizer-json/requirements.txt
  source_revision: 9ab7691f497eff905f961aba51a4bb9be3e9555c
  runner: reference/tokenizer-json/run_tokenizer_json.py --truncate 16 --without-special-tokens --batch ... --pad-token "<|pad|>" --pair-batch ...
  offsets_unit: unicode-scalars   # reference unit; the .NET API also gives utf16-code-units

pipeline:   # exactly what the pinned file declares
  normalizer: null
  pre_tokenizer: Sequence[Split(Regex "(?i:'s|'t|'re|'ve|'m|'ll|'d)|[^\r\n\p{L}\p{N}]?\p{L}+|\p{N}{1,3}| ?[^\s\p{L}\p{N}]+[\r\n]*|\s*[\r\n]+|\s+(?!\S)|\s+", Isolated, invert false), ByteLevel(add_prefix_space false, trim_offsets true, use_regex false)]
  model: BPE(vocab 124893, merges 293320, unk_token null, byte_fallback false, ignore_merges true, dropout null, empty prefix and suffix)
  post_processor: ByteLevel(add_prefix_space true, trim_offsets false, use_regex true)   # adds no tokens
  decoder: ByteLevel   # options unused by the decoder
  added_tokens: "140 (ids 124893-125032, all normalized false, no lstrip, rstrip or single_word); special false: <think>, </think>, <|tool_call_start|>, <|tool_call_end|> and the 12 XML tool tags 125017-125028 (<tools> to </additional_tools>); the rest special"
  truncation: null
  padding: null

conformance:
  fixtures: conformance/lfm3-bpe-chat/   # proposed, not yet accepted by a maintainer (PROPOSED.md)
  corpus:
    - conformance/corpus/tokenizer-corpus-v1.jsonl (49 cases, sha256 8c291a87644c79012d00029c00480a81aa9e508138e4b7fe1485bb7cd1519199)
    - conformance/corpus/tokenizer-corpus-qwen-bpe-v1.jsonl (88 cases, sha256 8a95607487e6cb9a9c7aabeebbbc93bb5c62b206364db43e0c419061e9c2aed3)
  tests:
    - tests/Starlings.Tokenizers.Tests/ProfileConformanceTests.cs   # data-driven: encode, decode, truncated, without_special_tokens
    - tests/Starlings.Tokenizers.Tests/QwenSplitPatternTests.cs     # Llama 3 digit groups against the reference
  result: # 2026-10-28, Linux x64, .NET SDK 10.0.100, Debug
    encode: "137/137 cases exact (133 single, 4 pairs): ids, tokens, type_ids, attention_mask, special_tokens_mask, utf16 and scalar offsets, sequence_ids"
    encode_without_special_tokens: 137/137 cases exact (the same encodings; this post-processor adds nothing)
    truncation: "52/52 truncated records exact (max_length 16, longest_first, right)"
    batch: 6 single texts and 4 pairs right-padded with <|pad|> 124893, exact, each row equal to its single encode
    decode: 137/137 cases exact, skip_special_tokens true and false

capabilities:
  encode_single: supported
  encode_pair: experimental            # 4 corpus pairs and a padded pair batch
  encode_batch: supported              # batch of single encodes
  add_special_tokens_false: supported  # nothing to add; every case recorded both ways
  offsets_utf16_code_units: supported
  offsets_unicode_scalars: supported
  sequence_ids: supported
  special_tokens_mask: supported
  added_tokens_special_and_non_special_in_text: experimental   # the corpus has the generic literals, not the LFM3 tool tags
  decode_skip_special_tokens: supported
  decode_keep_special_tokens: supported
  decode_invalid_utf8: experimental    # shared ByteLevel decoder; no random id sequences for this profile
  truncation_right_longest_first: supported   # max_length 16 over the corpus (single and pair)
  truncation_left_only_first_only_second: experimental   # generic code path; no fixture for this profile
  padding_right_batch_longest: supported   # tokenizer-batch.json, pad <|pad|> 124893, singles and pairs
  padding_left_fixed_multiple: experimental   # generic code path; no fixture for this profile
  bpe_dropout_unk_token_byte_fallback_affixes: unsupported   # rejected at load
  single_word_added_token: unsupported # rejected at load
  chat_template: unsupported           # model-library behavior (starlinghq/starling)
  incremental_decode_stream: unsupported
  thread_safety: untested              # immutable by design
  performance: untested

known_divergences:
  against_reference: none on the fixtures
  risks:
    - regex character classes are generated tables probed from the reference (tools/generate-unicode-tables.py); a different reference build would need a regeneration and requalification
    - no randomized differential run yet for the \p{N}{1,3} alternative; coverage is the corpus digit cases (bpe-digits-runs, bpe-long-digits and others) and QwenSplitPatternTests
