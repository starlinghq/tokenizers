name: ci

# Every pull request and every push to main. No secrets; read-only token.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  # Names of an unrelated older project must never enter this repository (tools/check-boundary.py).
  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - run: python3 -I tools/check-boundary.py

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      # Pinned tokenizer.json assets (public Hub files, SHA-256 verified, never committed).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: tokenizer-assets-${{ hashFiles('tools/pinned-assets.txt', 'tools/fetch-assets.sh') }}
      - name: Fetch pinned assets
        shell: bash
        run: tools/fetch-assets.sh
      - name: Test (every asset required, locked restore)
        run: dotnet test --solution Tokenizers.slnx --configuration Release
        env:
          STARLING_REQUIRE_ASSETS: "1"
      - name: Independence from Microsoft.ML.Tokenizers
        shell: bash
        run: tools/check-independence.sh

  # Clean clone, pack, local folder feed, clean consumer outside the checkout. Nothing is published.
  release-drill:
    name: release drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: tokenizer-assets-${{ hashFiles('tools/pinned-assets.txt', 'tools/fetch-assets.sh') }}
      - name: Fetch pinned assets
        run: tools/fetch-assets.sh
      - name: Release drill
        run: tools/release-drill.sh

  python:
    name: reference runners (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: pipx run ruff==0.16.9 check .
      - run: pipx run ruff==0.16.9 format --check .
