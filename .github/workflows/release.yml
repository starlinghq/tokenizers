name: release

# Release Starlings.Tokenizers (docs/releasing.md).
#
#   git tag v0.3.0-preview.1 && git push origin v0.3.0-preview.1
#
# 1. candidate: the tag must equal the version in Directory.Build.props, point at a commit on main and
#    have a CHANGELOG.md section. The release drill then tests with every asset required, packs, and
#    installs the package into a clean consumer outside the checkout. The exact .nupkg/.snupkg the
#    drill verified are uploaded as the `package` artifact.
# 2. publish: waits for approval on the `release` environment, pushes those bytes to nuget.org with
#    NuGet trusted publishing (a short-lived key from GitHub OIDC; no stored API key), and creates the
#    GitHub release with the CHANGELOG section as notes.
#
# Run by hand (workflow_dispatch) it builds the candidate only and never publishes.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  candidate:
    name: release candidate
    runs-on: [self-hosted, omarchy]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Boundary check
        run: python3 -I tools/check-boundary.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Version
        id: version
        run: |
          version="$(dotnet msbuild src/Starlings.Tokenizers -getProperty:Version)"
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "version ${version}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match the project version ${version} (Directory.Build.props)."
              exit 1
            fi
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main."
              exit 1
            fi
          fi
          if ! grep -qE "^## \[${version//./\\.}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section."
            exit 1
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .models
          key: tokenizer-assets-${{ hashFiles('tools/pinned-assets.txt', 'tools/fetch-assets.sh') }}
      - name: Fetch pinned assets
        run: tools/fetch-assets.sh
      # Tests (assets required, locked restore), independence check, pack, nuspec checks, local-feed
      # push and clean consumer outside the checkout.
      - name: Release drill
        run: tools/release-drill.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: artifacts/release-drill/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish to nuget.org
    needs: candidate
    if: github.ref_type == 'tag'
    runs-on: [self-hosted, omarchy]
    environment: release # required reviewer; NUGET_USER is a variable of this environment
    permissions:
      contents: write # create the GitHub release
      id-token: write # NuGet trusted publishing
    env:
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package
      - name: Package is the drilled candidate
        run: |
          ls -l package
          test -f "package/Starlings.Tokenizers.${VERSION}.nupkg"
          test -f "package/Starlings.Tokenizers.${VERSION}.snupkg"
          grep -qx 'RESULT: PASS' package/consumer.log
          sha256sum package/*.nupkg package/*.snupkg
      - name: NuGet login (OIDC)
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      # No --skip-duplicate: a published version is immutable, so pushing one twice must fail.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "package/Starlings.Tokenizers.${VERSION}.nupkg"
          --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
      # The GitHub release through the REST API (actions/github-script), so the runner needs no gh CLI. A rerun
      # resumes: an existing release for the tag is kept as it is (title, notes, pre-release flag) and only the
      # assets it lacks are uploaded; an asset already there with a different size fails the step.
      - name: Release notes
        run: |
          awk -v v="${VERSION}" '
            $0 ~ "^## \\[" { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md >notes.md
      - name: GitHub release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: Starlings.Tokenizers ${{ needs.candidate.outputs.version }}
          NOTES_FILE: notes.md
          ASSETS: |
            package/Starlings.Tokenizers.${{ needs.candidate.outputs.version }}.nupkg
            package/Starlings.Tokenizers.${{ needs.candidate.outputs.version }}.snupkg
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const tag = process.env.GITHUB_REF_NAME;
            const version = process.env.VERSION;
            const files = process.env.ASSETS.split('\n').map(f => f.trim()).filter(Boolean);
            for (const f of files) {
              if (!fs.statSync(f).isFile()) throw new Error(`${f} is not a file`);
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(r => r.tag_name === tag);
            if (release) {
              core.notice(`Release ${tag} already exists (${release.html_url}); only missing assets are uploaded.`);
            } else {
              ({ data: release } = await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, name: process.env.TITLE,
                body: fs.readFileSync(process.env.NOTES_FILE, 'utf8'),
                prerelease: version.includes('-'),
              }));
              core.info(`Created release ${release.html_url}`);
            }
            const assets = await github.paginate(github.rest.repos.listReleaseAssets,
              { owner, repo, release_id: release.id, per_page: 100 });
            for (const f of files) {
              const name = path.basename(f);
              const size = fs.statSync(f).size;
              const existing = assets.find(a => a.name === name);
              if (existing && existing.state === 'uploaded') {
                if (existing.size !== size) {
                  throw new Error(`Asset ${name} on ${tag} has ${existing.size} bytes, the local file ${size}; not replacing it.`);
                }
                core.info(`${name} already attached; skipped.`);
                continue;
              }
              if (existing) {
                // A broken upload from an earlier attempt.
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data: fs.readFileSync(f),
                headers: { 'content-type': 'application/octet-stream', 'content-length': size },
              });
              core.info(`Uploaded ${name} (${size} bytes).`);
            }
